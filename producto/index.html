<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F3EDE4" />
  <title>Producto | VYÓRE</title>
  <link rel="icon" href="../assets/vyore/isotipo-vyore.png" type="image/png" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="product.css" />
</head>
<body class="product-page-body">
  <header class="product-page-header">
    <a class="product-page-brand" href="../" aria-label="Volver a VYÓRE">
      <img src="../assets/vyore/logo-vyore.png" alt="VYÓRE" />
    </a>
    <nav class="product-page-nav" aria-label="Producto">
      <a class="product-nav-icon" href="../#productos" aria-label="Productos">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z" /></svg>
      </a>
      <a class="product-nav-icon product-nav-cart" href="../carrito/" aria-label="Carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 18a2 2 0 1 0 .01 0H7Zm10 0a2 2 0 1 0 .01 0H17ZM4.2 4l1.5 9.2A3 3 0 0 0 8.7 16h7.8a3 3 0 0 0 2.9-2.3l1.1-5.2H7.1L6.7 6H3V4h1.2Z" /></svg>
        <strong id="productHeaderCartCount">0</strong>
      </a>
    </nav>
  </header>

  <main class="product-page" data-product-page>
    <section class="product-gallery" aria-label="Imagen de producto">
      <img id="productImage" alt="" />
    </section>

    <section class="product-info" aria-labelledby="productName">
      <p class="eyebrow" id="productCategory">VYÓRE</p>
      <h1 id="productName"></h1>
      <p class="product-price" id="productPrice"></p>
      <p class="product-description" id="productDescription"></p>

      <div class="product-facts">
        <div><span>Tela</span><strong id="productFabric"></strong></div>
        <div><span>Tallas</span><strong id="productSizes"></strong></div>
        <div><span>Detalle</span><strong id="productDetail"></strong></div>
      </div>

      <section class="product-variants" aria-label="Variantes de color">
        <div class="variant-title-row">
          <span>Color</span>
          <strong id="variantStock">Disponible</strong>
        </div>
        <div id="variantOptions" class="variant-options"></div>
      </section>

      <div class="product-actions">
        <a id="sendWhatsapp" class="btn primary" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
        <button id="addToCart" class="btn secondary" type="button">Agregar al carrito</button>
      </div>
      <a class="back-link" href="../#productos">Volver a productos</a>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../productos.js"></script>
  <script src="../catalog-utils.js"></script>
  <script src="product.js"></script>
</body>
</html>
